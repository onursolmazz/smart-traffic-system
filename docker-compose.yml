services:
  frontend:
    build:
      context: ./frontend

    container_name: smart-traffic-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend


  backend:
    build:
      context: ./backend

    container_name: smart-traffic-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor

    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: smart_traffic
      DB_USERNAME: smart_traffic
      DB_PASSWORD: secret

      REDIS_HOST: redis
      REDIS_PORT: 6379

      QUEUE_CONNECTION: redis

    depends_on:
      - mysql
      - redis


  queue-worker:
    build:
      context: ./backend

    container_name: smart-traffic-queue-worker

    working_dir: /var/www

    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor

    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: smart_traffic
      DB_USERNAME: smart_traffic
      DB_PASSWORD: secret

      REDIS_HOST: redis
      REDIS_PORT: 6379

      QUEUE_CONNECTION: redis

    depends_on:
      - mysql
      - redis

    command: php artisan queue:work redis --sleep=2 --tries=3 --timeout=60

    restart: unless-stopped


  mysql:
    image: mysql:8.4

    container_name: smart-traffic-mysql

    environment:
      MYSQL_DATABASE: smart_traffic
      MYSQL_USER: smart_traffic
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql


  redis:
    image: redis:7-alpine

    container_name: smart-traffic-redis

    ports:
      - "6380:6379"


volumes:
  mysql_data:
  frontend_node_modules:
  backend_vendor: